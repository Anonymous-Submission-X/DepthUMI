<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="DepthUMI — anonymous research project page.">
<title>DepthUMI</title>
<style>
:root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172330; background: #f6f7f9; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
main { width: min(100%, 760px); padding: clamp(32px, 8vw, 80px); background: #fff; border: 1px solid #e3e7ec; border-radius: 20px; text-align: center; }
.label { color: #526479; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
h1 { font-size: clamp(48px, 10vw, 80px); letter-spacing: -.065em; margin: 22px 0 14px; line-height: 1.05; }
.authors { color: #526479; font-size: 16px; }
.divider { width: 40px; height: 3px; background: #597d97; margin: 34px auto; border-radius: 2px; }
.notice { color: #526479; line-height: 1.7; font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
<p class="label">Research project</p>
<h1>DepthUMI</h1>
<p class="authors">Anonymous Authors</p>
<div class="divider" aria-hidden="true"></div>
<p class="notice">Project materials are being prepared.</p>
</main>
</body>
</html>
