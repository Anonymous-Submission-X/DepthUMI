<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="DepthUMI — anonymous research project page.">
  <title>DepthUMI</title>
  <style>
    @font-face { font-family: "GFS Didot"; src: url("assets/fonts/GFSDidot.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
    :root {
      color-scheme: light;
      --ink: #101112;
      --muted: #696b70;
      --rule: #dedfe1;
      --gutter: clamp(24px, 5vw, 96px);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0 var(--gutter);
    }
    header, footer { display: flex; justify-content: space-between; gap: 24px; }
    header {
      min-height: 106px;
      align-items: center;
      border-bottom: 1px solid var(--rule);
    }
    .wordmark { font-family: "GFS Didot", Didot, Georgia, serif; font-size: 20px; font-weight: 400; letter-spacing: -.025em; }
    .category, footer { font-size: 13px; line-height: 1.6; color: var(--muted); }
    main { display: flex; flex-direction: column; justify-content: center; padding: 96px 0 132px; }
    h1 {
      margin: 0;
      font-family: "GFS Didot", Didot, "Bodoni MT", Georgia, serif;
      font-size: clamp(56px, 10vw, 160px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.1;
    }
    .stroke { width: clamp(48px, 6.7vw, 104px); height: 1px; background: var(--ink); margin: 50px 0 0 6px; }
    footer { min-height: 114px; padding: 30px 0; border-top: 1px solid var(--rule); align-items: flex-start; }
    footer p { margin: 0; }
    ::selection { color: #fff; background: #222; }
    @media (max-width: 600px) {
      header { min-height: 80px; }
      .wordmark { font-size: 18px; }
      .category, footer { font-size: 12px; }
      h1 { font-size: clamp(48px, 13.4vw, 80px); }
      main { padding: 88px 0 112px; }
      .stroke { margin-top: 40px; margin-left: 2px; }
      footer { min-height: 116px; flex-direction: column; gap: 9px; padding: 24px 0; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      header { min-height: 70px; }
      main { padding: 48px 0; }
      h1 { font-size: 80px; }
      .stroke { margin-top: 24px; }
      footer { min-height: 75px; padding: 20px 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="wordmark">DepthUMI</span>
      <span class="category">Research project</span>
    </header>
    <main>
      <h1>DepthUMI</h1>
      <div class="stroke" aria-hidden="true"></div>
    </main>
    <footer>
      <p>Anonymous Authors</p>
      <p>Project materials are being prepared.</p>
    </footer>
  </div>
</body>
</html>
